name: Dependabot Dist Bundle

# O Dependabot altera só o package.json/yarn.lock, e o dist/ comitado fica
# desatualizado. O test.yml continua validando o dist/ também nos PRs do
# Dependabot, então o pipeline do commit original falha e o auto-merge não
# entra. Este workflow recompila o bundle, comita no branch do PR e dispara o
# test.yml no commit novo (workflow_dispatch é um dos eventos que o
# GITHUB_TOKEN consegue disparar). O check "pipeline" do commit novo é o que
# libera o merge, com o dist/ validado.

on:
  pull_request:
    branches: [develop]

permissions: {}

jobs:
  build-dist:
    # dependências recém-atualizadas rodam só com permissão de leitura
    if: >-
      github.actor == 'dependabot[bot]' &&
      github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    permissions:
      contents: read
    outputs:
      changed: ${{ steps.diff.outputs.changed }}
    steps:
      - name: Checkout do commit do PR
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          persist-credentials: false

      - name: Setup Node.js 24 com cache do Yarn
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 24.x
          cache: 'yarn'

      - name: Instalar dependências sem scripts de instalação
        run: yarn install --frozen-lockfile --ignore-scripts

      - name: Recompilar o bundle (dist/)
        run: yarn run build

      - name: Verificar se o dist/ mudou
        id: diff
        run: |
          if [ -n "$(git status --porcelain dist/)" ]; then
            echo "changed=true" >> "$GITHUB_OUTPUT"
          else
            echo "::notice::O bundle dist/ já está atualizado."
            echo "changed=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Guardar o dist/ recompilado
        if: steps.diff.outputs.changed == 'true'
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: dist
          path: dist/
          retention-days: 1
          if-no-files-found: error

  commit-dist:
    # só baixa o artefato e comita: não instala nem executa dependências
    needs: build-dist
    if: needs.build-dist.outputs.changed == 'true'
    runs-on: ubuntu-latest
    permissions:
      contents: write
      actions: write
    env:
      HEAD_REF: ${{ github.event.pull_request.head.ref }}
      HEAD_SHA: ${{ github.event.pull_request.head.sha }}
    steps:
      - name: Checkout do branch do PR
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.event.pull_request.head.ref }}
          persist-credentials: false

      - name: Conferir que o branch não andou
        run: |
          # se o Dependabot empurrou outro commit, a execução desse commit cuida do dist/
          if [ "$(git rev-parse HEAD)" != "$HEAD_SHA" ]; then
            echo "::notice::O branch $HEAD_REF mudou desde o build; nada a comitar."
            echo "STALE=true" >> "$GITHUB_ENV"
          fi

      - name: Substituir o dist/ pelo recompilado
        if: env.STALE != 'true'
        run: rm -rf dist

      - name: Baixar o dist/ recompilado
        if: env.STALE != 'true'
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          name: dist
          path: dist

      - name: Comitar e enviar o dist/
        if: env.STALE != 'true'
        env:
          TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A dist/
          git commit -m "build(dist): recompila o bundle após atualização de dependências"
          AUTH=$(printf 'x-access-token:%s' "$TOKEN" | base64 -w0)
          echo "::add-mask::$AUTH"
          git -c http.extraheader="AUTHORIZATION: basic $AUTH" \
            push origin "HEAD:refs/heads/$HEAD_REF"

      - name: Rodar o test.yml no commit novo
        if: env.STALE != 'true'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: gh workflow run test.yml --repo "$GITHUB_REPOSITORY" --ref "$HEAD_REF"
