name: Dependabot Dist Bundle

on: pull_request

permissions:
  contents: write

jobs:
  rebuild-dist:
    runs-on: ubuntu-latest
    # O Dependabot atualiza só o package.json/yarn.lock; o bundle dist/ precisa ser recompilado
    if: github.actor == 'dependabot[bot]'
    steps:
      - name: Checkout do branch do PR
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.head_ref }}

      - name: Setup Node.js 24 com cache do Yarn
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 24.x
          cache: 'yarn'

      - name: Instalar dependências
        run: yarn install --frozen-lockfile

      - name: Recompilar o bundle (dist/)
        run: yarn run build

      - name: Comitar o dist/ atualizado no PR
        run: |
          if [ -z "$(git status --porcelain dist/)" ]; then
            echo "::notice::O bundle dist/ já está atualizado."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add dist/
          git commit -m "build(dist): recompila o bundle após atualização de dependências"
          git push
