name: Rodar Testes

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main, develop]

jobs:
  pipeline:
    runs-on: ubuntu-latest
    env:
      SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          fetch-depth: 0

      - name: Setup Node
        uses: actions/setup-node@39370e3970a6d050c480ffad4ff0ed4d3fdee5af # v4.1.0
        with:
          node-version: 20.x

      - name: Instalar dependências
        run: yarn install --frozen-lockfile

      - name: Rodar Linter (ESLint + Prettier)
        run: yarn lint

      - name: Rodar testes
        run: yarn run jest --coverage --ci --silent

      - name: Validar integridade e compilação do bundle (dist/)
        run: |
          yarn run build
          if [ -n "$(git status --porcelain dist/)" ]; then
            echo "::error::O bundle dist/ está desatualizado em relação a src/. Execute 'yarn build' localmente e comite as alterações."
            git diff dist/
            exit 1
          fi

      - name: Gerar metadados do PR / Execução
        run: |
          mkdir -p pr_metadata
          cat << 'EOF' > pr_metadata/metadata.json
          {
            "event_name": "${{ github.event_name }}",
            "pr_number": "${{ github.event.pull_request.number }}",
            "head_ref": "${{ github.event.pull_request.head.ref || github.ref_name }}",
            "head_repo": "${{ github.event.pull_request.head.repo.full_name || github.repository }}",
            "head_sha": "${{ github.event.pull_request.head.sha || github.sha }}",
            "base_ref": "${{ github.event.pull_request.base.ref || github.ref_name }}"
          }
          EOF

      - name: Upload de artefatos de cobertura e metadados
        uses: actions/upload-artifact@4cec3d8aa04e39d1a68397de0c4cd6fb9dce8ec1 # v4.6.1
        with:
          name: test-coverage-artifacts
          path: |
            coverage/lcov.info
            coverage/clover.xml
            pr_metadata/metadata.json
          retention-days: 1

      - name: Scanner do SonarCloud (Fallback para contexto com secrets)
        if: env.SONAR_TOKEN != ''
        uses: SonarSource/sonarqube-scan-action@ba9859eae8dd6bd29e412f25ddbbef3d032000f4 # v8.2.2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}

      - name: Notificação de SonarCloud desacoplado
        if: env.SONAR_TOKEN == ''
        run: echo "::notice::SONAR_TOKEN não disponível neste contexto (PR de fork). Testes concluídos com sucesso e artefatos salvos para a esteira do SonarCloud."
