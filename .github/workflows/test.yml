name: Rodar Testes

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main, develop]

jobs:
  pipeline:
    runs-on: ubuntu-latest
    env:
      SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          fetch-depth: 0

      - name: Setup Node
        uses: actions/setup-node@39370e3970a6d050c480ffad4ff0ed4d3fdee5af # v4.1.0
        with:
          node-version: 20.x

      - name: Instalar dependências
        run: yarn install --frozen-lockfile

      - name: Rodar Linter (ESLint + Prettier)
        run: yarn lint

      - name: Rodar testes
        run: yarn run jest --coverage --ci --silent

      - name: Validar integridade e compilação do bundle (dist/)
        run: |
          yarn run build
          if [ -n "$(git status --porcelain dist/)" ]; then
            echo "::error::O bundle dist/ está desatualizado em relação a src/. Execute 'yarn build' localmente e comite as alterações."
            git diff dist/
            exit 1
          fi

      - name: SonarQube Scan
        if: env.SONAR_TOKEN != ''
        uses: SonarSource/sonarqube-scan-action@22918119ff8e1ca75a623e15c8296b6ea4fbe28f # v8.2.1
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
        with:
          args: >
            -Dsonar.projectKey=${{ github.repository_owner }}_${{ github.event.repository.name }}

      - name: Aviso de SonarQube ignorado (Pull Request de Fork)
        if: env.SONAR_TOKEN == ''
        run: echo "::notice::SONAR_TOKEN ausente (execução em fork público). Etapa de análise do SonarQube ignorada com segurança."
