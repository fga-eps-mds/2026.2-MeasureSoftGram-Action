name: Rodar Testes

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main, develop]
  # disparado pelo próprio pipeline no commit do dist/ recompilado de um PR do Dependabot
  workflow_dispatch:

jobs:
  pipeline:
    runs-on: ubuntu-latest
    permissions:
      contents: write   # só o passo do Dependabot faz push; PR de fork continua só leitura
      actions: write    # disparar este workflow no commit do dist/ recompilado
    env:
      DEPENDABOT_PR: >-
        ${{ github.event.pull_request.user.login == 'dependabot[bot]' &&
            github.event.pull_request.head.repo.full_name == github.repository }}
    steps:
      - name: Checkout do código
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          # no PR do Dependabot, o branch do PR (e não o merge commit) para poder comitar o dist/
          ref: ${{ github.event.pull_request.user.login == 'dependabot[bot]' && github.head_ref || '' }}
          # o token não fica no .git/config enquanto as dependências rodam
          persist-credentials: false

      - name: Setup Node.js 24 com cache do Yarn
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 24.x
          cache: 'yarn'

      # o build e os testes não dependem de scripts de instalação; sem eles, uma
      # dependência recém-atualizada não executa nada durante o install
      - name: Instalar dependências
        run: yarn install --frozen-lockfile --ignore-scripts

      # Antes do lint e dos testes, para o head do PR mudar o quanto antes: o check
      # verde deste commit deixa de ser o do head, e o auto-merge espera a execução
      # disparada no commit novo, que valida o dist/ comitado.
      - name: Recompilar e comitar o dist/ (PR do Dependabot)
        if: env.DEPENDABOT_PR == 'true'
        env:
          TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          HEAD_REF: ${{ github.head_ref }}
        run: |
          yarn run build
          if [ -z "$(git status --porcelain dist/)" ]; then
            echo "::notice::O bundle dist/ já está atualizado."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A dist/
          git commit -m "build(dist): recompila o bundle após atualização de dependências"
          AUTH=$(printf 'x-access-token:%s' "$TOKEN" | base64 -w0)
          echo "::add-mask::$AUTH"
          git -c http.extraheader="AUTHORIZATION: basic $AUTH" \
            push origin "HEAD:refs/heads/$HEAD_REF"
          # push com o GITHUB_TOKEN não dispara workflows; o workflow_dispatch é exceção
          gh workflow run test.yml --repo "$GITHUB_REPOSITORY" --ref "$HEAD_REF"

      - name: Rodar Linter (ESLint + Prettier)
        run: yarn lint

      - name: Rodar testes unitários com cobertura
        run: yarn ci:test --silent

      - name: Validar integridade e compilação do bundle (dist/)
        # vale para todos, inclusive o Dependabot (o passo anterior já comitou o dist/)
        run: |
          yarn run build
          if [ -n "$(git status --porcelain dist/)" ]; then
            echo "::error::O bundle dist/ está desatualizado em relação a src/. Execute 'yarn build' localmente e comite as alterações."
            git diff dist/
            exit 1
          fi

      - name: SonarCloud Scanner
        # O SonarCloud só deve ser executado se:
        # 1. Não for disparado pelo Dependabot (que não possui acesso aos secrets de Actions)
        # 2. O evento for push (merge) OU um PR interno do próprio repositório (não fork externo)
        # 3. Não for a execução disparada no commit do dist/ do Dependabot (workflow_dispatch)
        if: >-
          github.actor != 'dependabot[bot]' &&
          github.event_name != 'workflow_dispatch' &&
          (github.event_name != 'pull_request' ||
           github.event.pull_request.head.repo.full_name == github.repository)
        # 'sonar.qualitygate.wait=true' pausa a execução do step e consulta a API do SonarCloud
        # até a conclusão da análise. Se o Quality Gate for reprovado (cobertura insuficiente, bugs,
        # code smells), o scanner encerra com código de erro diferente de zero e quebra o CI na hora.
        uses: SonarSource/sonarqube-scan-action@d209202bc7d53ff1cc128f7f907dac145c9d6ae9 # v8.3.0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
        with:
          args: >
            -Dsonar.projectKey=${{ github.repository_owner }}_${{ github.event.repository.name }}
            -Dsonar.qualitygate.wait=true

      - name: Aviso de SonarCloud ignorado (Pull Request externo ou Dependabot)
        if: >-
          github.actor == 'dependabot[bot]' ||
          github.event_name == 'workflow_dispatch' ||
          (github.event_name == 'pull_request' &&
           github.event.pull_request.head.repo.full_name != github.repository)
        run: echo "::notice::Execução em fork externo ou ator Dependabot sem acesso aos secrets. Análise do SonarCloud ignorada com segurança."

      # Artefatos salvos no CI para auditoria manual
      - name: Preservar relatórios de testes
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: test-reports
          retention-days: 14
          if-no-files-found: ignore
          path: |
            coverage.xml
            coverage/lcov.info
            coverage/coverage-summary.json
