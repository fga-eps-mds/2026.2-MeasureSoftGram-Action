name: Rodar Testes

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main, develop]
  # disparado pelo job commit-dist no commit do dist/ recompilado de um PR do Dependabot
  workflow_dispatch:

permissions: {}

jobs:
  # PR do Dependabot: o dist/ é recompilado com as dependências novas, sem token de
  # escrita no job. Só o artefato sai daqui.
  build-dist:
    if: >-
      github.event_name == 'pull_request' &&
      github.event.pull_request.user.login == 'dependabot[bot]' &&
      github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    permissions:
      contents: read
    outputs:
      changed: ${{ steps.diff.outputs.changed }}
    steps:
      - name: Checkout do commit do PR
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          persist-credentials: false

      - name: Setup Node.js 24 com cache do Yarn
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 24.x
          cache: 'yarn'

      - name: Instalar dependências sem scripts de instalação
        run: yarn install --frozen-lockfile --ignore-scripts

      - name: Recompilar o bundle (dist/)
        run: yarn run build

      - name: Verificar se o dist/ mudou
        id: diff
        run: |
          if [ -n "$(git status --porcelain dist/)" ]; then
            echo "changed=true" >> "$GITHUB_OUTPUT"
          else
            echo "::notice::O bundle dist/ já está atualizado."
            echo "changed=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Guardar o dist/ recompilado
        if: steps.diff.outputs.changed == 'true'
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: dist
          path: dist/
          retention-days: 1
          if-no-files-found: error

  # Único job com escrita: não instala nem executa dependências, só baixa o artefato,
  # comita e roda este workflow no commit novo (push com o GITHUB_TOKEN não dispara
  # workflows; o workflow_dispatch é exceção).
  commit-dist:
    needs: build-dist
    if: needs.build-dist.outputs.changed == 'true'
    runs-on: ubuntu-latest
    permissions:
      contents: write
      actions: write
    outputs:
      pushed: ${{ steps.push.outputs.pushed }}
    env:
      HEAD_REF: ${{ github.event.pull_request.head.ref }}
      HEAD_SHA: ${{ github.event.pull_request.head.sha }}
    steps:
      - name: Checkout do branch do PR
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.event.pull_request.head.ref }}
          persist-credentials: false

      - name: Conferir que o branch não andou
        run: |
          # se o Dependabot empurrou outro commit, a execução desse commit cuida do dist/
          if [ "$(git rev-parse HEAD)" != "$HEAD_SHA" ]; then
            echo "::notice::O branch $HEAD_REF mudou desde o build; nada a comitar."
            echo "STALE=true" >> "$GITHUB_ENV"
          fi

      - name: Substituir o dist/ pelo recompilado
        if: env.STALE != 'true'
        run: rm -rf dist

      - name: Baixar o dist/ recompilado
        if: env.STALE != 'true'
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          name: dist
          path: dist

      - name: Comitar, enviar e rodar o pipeline no commit novo
        id: push
        if: env.STALE != 'true'
        env:
          TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A dist/
          git commit -m "build(dist): recompila o bundle após atualização de dependências"
          AUTH=$(printf 'x-access-token:%s' "$TOKEN" | base64 -w0)
          echo "::add-mask::$AUTH"
          git -c http.extraheader="AUTHORIZATION: basic $AUTH" \
            push origin "HEAD:refs/heads/$HEAD_REF"
          echo "pushed=true" >> "$GITHUB_OUTPUT"
          gh workflow run test.yml --repo "$GITHUB_REPOSITORY" --ref "$HEAD_REF"

  pipeline:
    needs: [build-dist, commit-dist]
    # Roda em todo evento, inclusive com os jobs do Dependabot pulados. Só é pulado no
    # commit cujo dist/ acabou de ser recompilado: o head do PR já é o commit novo, e é o
    # pipeline dele (disparado pelo commit-dist) que valida o dist/ e libera o merge.
    # Assim a execução do commit antigo termina sem falha.
    if: ${{ !cancelled() && needs.commit-dist.outputs.pushed != 'true' }}
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: read
    steps:
      - name: Checkout do código
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Setup Node.js 24 com cache do Yarn
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 24.x
          cache: 'yarn'

      - name: Instalar dependências
        run: yarn install --frozen-lockfile --ignore-scripts

      - name: Rodar Linter (ESLint + Prettier)
        run: yarn lint

      - name: Rodar testes unitários com cobertura
        run: yarn ci:test --silent

      - name: Validar integridade e compilação do bundle (dist/)
        # vale para todos, inclusive o Dependabot: no commit do dist/ recompilado ele passa
        run: |
          yarn run build
          if [ -n "$(git status --porcelain dist/)" ]; then
            echo "::error::O bundle dist/ está desatualizado em relação a src/. Execute 'yarn build' localmente e comite as alterações."
            git diff dist/
            exit 1
          fi

      - name: SonarCloud Scanner
        # O SonarCloud só deve ser executado se:
        # 1. Não for disparado pelo Dependabot (que não possui acesso aos secrets de Actions)
        # 2. O evento for push (merge) OU um PR interno do próprio repositório (não fork externo)
        # 3. Não for a execução disparada pelo commit-dist no branch do Dependabot (workflow_dispatch)
        if: >-
          github.actor != 'dependabot[bot]' &&
          github.event_name != 'workflow_dispatch' &&
          (github.event_name != 'pull_request' ||
           github.event.pull_request.head.repo.full_name == github.repository)
        # 'sonar.qualitygate.wait=true' pausa a execução do step e consulta a API do SonarCloud
        # até a conclusão da análise. Se o Quality Gate for reprovado (cobertura insuficiente, bugs,
        # code smells), o scanner encerra com código de erro diferente de zero e quebra o CI na hora.
        uses: SonarSource/sonarqube-scan-action@d209202bc7d53ff1cc128f7f907dac145c9d6ae9 # v8.3.0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
        with:
          args: >
            -Dsonar.projectKey=${{ github.repository_owner }}_${{ github.event.repository.name }}
            -Dsonar.qualitygate.wait=true

      - name: Aviso de SonarCloud ignorado (Pull Request externo ou Dependabot)
        if: >-
          github.actor == 'dependabot[bot]' ||
          github.event_name == 'workflow_dispatch' ||
          (github.event_name == 'pull_request' &&
           github.event.pull_request.head.repo.full_name != github.repository)
        run: echo "::notice::Execução em fork externo ou ator Dependabot sem acesso aos secrets. Análise do SonarCloud ignorada com segurança."

      # Artefatos salvos no CI para auditoria manual
      - name: Preservar relatórios de testes
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: test-reports
          retention-days: 14
          if-no-files-found: ignore
          path: |
            coverage.xml
            coverage/lcov.info
            coverage/coverage-summary.json
