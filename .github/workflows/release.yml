name: Release & Dist Bundle

on:
  push:
    branches:
      - main
    tags:
      - 'v*.*.*'
      - 'v*'
  release:
    types: [published]
  workflow_dispatch:
    inputs:
      dry_run:
        description: 'Executar em modo dry-run (não cria release nem move tags de produção)'
        required: false
        default: false
        type: boolean

permissions:
  contents: write

jobs:
  build-and-release:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          fetch-depth: 0

      - name: Setup Node.js 20
        uses: actions/setup-node@39370e3970a6d050c480ffad4ff0ed4d3fdee5af # v4.1.0
        with:
          node-version: 20.x
          cache: 'yarn'

      - name: Instalar dependências
        run: yarn install --frozen-lockfile

      - name: Validar linting
        run: yarn lint

      - name: Executar testes unitários
        run: yarn run jest --coverage --ci --silent

      - name: Compilar bundle de distribuição (dist/)
        run: yarn run build

      - name: Verificar integridade do bundle compilado
        run: |
          if [ ! -f dist/index.js ]; then
            echo "::error::dist/index.js não foi gerado pelo build!"
            exit 1
          fi
          echo "Bundle compilado com sucesso: $(ls -lh dist/index.js | awk '{print $5}')"

      - name: Sincronizar dist/ na branch se houver modificações
        if: github.event_name == 'push' && github.ref == 'refs/heads/main' && inputs.dry_run != true
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          if [ -n "$(git status --porcelain dist/)" ]; then
            git add dist/
            git commit -m "chore(release): compilar bundle dist/ para producao [skip ci]"
            git push origin main
          else
            echo "Bundle dist/ já se encontra perfeitamente sincronizado com src/."
          fi

      - name: Atualizar major tag móvel (ex: v1, v2)
        if: (startsWith(github.ref, 'refs/tags/v') || github.event_name == 'release') && inputs.dry_run != true
        run: |
          TAG_NAME="${GITHUB_REF#refs/tags/}"
          if [ "$github.event_name" = "release" ]; then
            TAG_NAME="${{ github.event.release.tag_name }}"
          fi
          MAJOR_TAG=$(echo "$TAG_NAME" | cut -d. -f1)

          echo "Atualizando tag móvel $MAJOR_TAG para apontar para $TAG_NAME..."
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git tag -fa "$MAJOR_TAG" -m "Release $TAG_NAME (atualização da major tag móvel $MAJOR_TAG)"
          git push origin "$MAJOR_TAG" --force

      - name: Criar ou atualizar GitHub Release
        if: (startsWith(github.ref, 'refs/tags/v') || github.event_name == 'release') && inputs.dry_run != true
        uses: softprops/action-gh-release@c95fe1489396fe8a9eb872386f83bc9b37e28b6a # v2.0.8
        with:
          generate_release_notes: true
          files: |
            dist/index.js
            dist/licenses.txt
            action.yml
